name: CPU CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install CPU runtime and development tools
        run: |
          python -m pip install 'torch>=2.2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,dev]'
          python -m pip check
          python -m pip freeze
      - name: Run offline CPU behavior tests
        run: python -m pytest -q
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Check installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -I -c 'import mlzo; from importlib.metadata import version; assert mlzo.__version__ == version("mlzo")'
          python -I -m mlzo --help
          mlzo --json --version
